<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "plus jarkata sans", sans-serif;
            background-color: #f7f9fb;
            color: #191919;
            line-height: 1.5;

        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        header {
            background-color: white;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e0e3e5;
            max-width: 100%;
            margin: auto;
            padding: 10px 20px;

        }

        #left-nav {
            display: flex;
            align-items: center;
            gap: 12px;


            ul {
                display: flex;
                list-style: none;
            }

            a {
                text-decoration: none;
                color: #464646;
                font-weight: 600;
                padding: 6px 12px;
                border-radius: 8px;
                transition: all 0.4s ease;
            }

            a:hover {
                background-color: #e6e8ea;
                color: #4648d4;
            }

            a.active {
                background-color: #e6e8ea;
                color: #4648df;
            }

            #logo {
                font-size: 20px;
                font-weight: bold;
                color: #4648df;
            }
        }

        #right-nav {
            gap: 12px;
            display: flex;
        }

        p {
            background-color: #e6e8ea;
            padding: 6px 12px;
            font-weight: 600;
            border-radius: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) 
            header {
                flex-direction: column;
                align-items: center;
            }
        




        #avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: bold 2px #4648df;
        } 
    </style>

</head>

<body>
    <header>

        <section id="left-nav">
            <h2 id="logo"> Quizmaster </h2>
            <nav id="nav">
                <ul>
                    <a href="#">
                        <li>Home</li>
                    </a>
                    <a href="#">
                        <li>Ranks</li>
                    </a>
                    <a href="#">
                        <li>Profile
                        <li>
                    </a>
                    <ul>

                    </ul>
            </nav>
        </section>

        <section id="right-nav">
            <p> lvl 12 . 400 coins </p>
            <img id="avatar" src="https://i.pravatar.cc/100?img=12" alt="">
        </section>
    </header>
    <section class="container py4">
        <h2 class="fw-bold">Ready to play, Barsit? </h2>
        <p class="lead">Your brain is warmed up, let's crush today's challenge.</p>

        <div class="shadow-sm rounded-5 overflow-hidden">
            <div class="progress rounded-0 bg-danger">
                </div>
                <div>
                    <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=800"
                    class="img-fluid
                    alt="">

                    </div

    </section>
    </header>



</body>

</html>
